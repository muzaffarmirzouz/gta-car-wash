<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#0a0d13;
    --surface:#12161e;
    --surface-2:#1a2029;
    --line:rgba(255,255,255,0.09);
    --text:#f3f4f6;
    --muted:#8b92a0;
    --steel:#aeb4bd;
    --blue:#5b93d1;
    --blue-dim:#5b93d11f;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;} }

  body{
    margin:0;
    background:
      radial-gradient(1000px 560px at 50% -10%, var(--blue-dim), transparent 62%),
      var(--ink);
    color:var(--text);
    font-family:'Jost', system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{color:inherit;}
  img{max-width:100%; display:block;}
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .display{font-family:'Playfair Display', 'Jost', serif;}

  .wrap{max-width:1080px; margin:0 auto; padding-inline:24px;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(10,13,19,0.75);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; padding-block:12px; gap:16px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand img{height:26px; width:auto;}
  .brand span{font-family:'Playfair Display', serif; font-weight:700; font-size:16px; letter-spacing:0.02em;}
  .est-badge{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em;
    color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 8px;
    white-space:nowrap;
  }
  @media (max-width:520px){ .est-badge{display:none;} }

  .langs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px;}
  .langs button{
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600; letter-spacing:0.04em;
    padding:6px 12px; border-radius:999px; border:none; background:transparent; color:var(--muted); cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .langs button:hover{color:var(--text);}
  .langs button.active{background:var(--steel); color:#0a0d13;}
  .langs button:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  /* ---------- hero ---------- */
  .hero{position:relative; padding-block:92px 68px; text-align:center; overflow:hidden;}
  .hero::before{
    content:"";
    position:absolute; left:50%; top:-120px; width:900px; height:900px; transform:translateX(-50%);
    background:radial-gradient(circle, rgba(255,255,255,0.05), transparent 60%);
    pointer-events:none;
  }
  .hero-logo{width:min(480px, 78vw); margin:0 auto 30px; position:relative; z-index:1;}
  .hero .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--muted); margin-bottom:20px; position:relative; z-index:1;
  }
  .hero .eyebrow::before, .hero .eyebrow::after{content:""; width:22px; height:1px; background:var(--steel); opacity:0.5;}
  .hero h1{
    font-family:'Playfair Display', serif; font-weight:700;
    font-size:clamp(26px, 4.2vw, 42px); margin:0 0 16px; text-wrap:balance; color:var(--text);
    position:relative; z-index:1;
  }
  .hero p.lede{max-width:56ch; margin:0 auto 34px; color:var(--muted); font-size:16px; position:relative; z-index:1;}
  .hero .cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; position:relative; z-index:1;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:2px; text-decoration:none;
    font-weight:600; font-size:14px; letter-spacing:0.02em; border:1px solid transparent; transition:transform .15s ease, filter .15s ease, background .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .btn-primary{background:var(--text); color:#0a0d13;}
  .btn-primary:hover{filter:brightness(0.92);}
  .btn-ghost{background:transparent; border-color:var(--steel); color:var(--text);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn svg{width:16px; height:16px; flex:none;}

  /* ---------- stat strip ---------- */
  .stats{border-block:1px solid var(--line); background:rgba(255,255,255,0.015);}
  .stats-inner{display:grid; grid-template-columns:repeat(3,1fr); text-align:center;}
  .stat{padding:28px 12px; position:relative;}
  .stat + .stat::before{content:""; position:absolute; left:0; top:20%; bottom:20%; width:1px; background:var(--line);}
  .stat .num{font-family:'Playfair Display', serif; font-weight:700; font-size:clamp(19px,2.8vw,27px); font-variant-numeric:tabular-nums;}
  .stat .cap{margin-top:6px; font-size:11.5px; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase;}

  /* ---------- section shell ---------- */
  section{padding-block:78px;}
  .kicker{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--muted); margin:0 0 12px; display:flex; align-items:center; gap:12px;
  }
  .kicker::after{content:""; height:1px; flex:1; background:var(--line);}
  .kicker span.mark{width:6px; height:6px; background:var(--steel); display:inline-block; transform:rotate(45deg);}
  h2.section-title{font-family:'Playfair Display', serif; font-weight:700; font-size:clamp(24px,3.2vw,32px); margin:0 0 14px; text-wrap:balance;}
  .section-sub{color:var(--muted); max-width:58ch; margin:0 0 44px; font-size:15px;}

  /* ---------- services (menu style) ---------- */
  .menu{display:grid; gap:0; border-top:1px solid var(--line);}
  .menu-row{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:22px;
    padding-block:26px; border-bottom:1px solid var(--line);
  }
  .menu-icon{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .menu-icon svg{width:21px; height:21px; color:var(--steel);}
  .menu-body h3{font-family:'Playfair Display', serif; font-weight:600; font-size:19px; margin:0 0 6px;}
  .menu-body p{margin:0; color:var(--muted); font-size:14px; max-width:52ch;}
  .menu-dots{display:none;}
  @media (min-width:640px){
    .menu-row{grid-template-columns:auto 1fr;}
  }

  /* ---------- pricing ---------- */
  .price-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:680px){ .price-grid{grid-template-columns:1fr;} }
  .price-card{
    position:relative; background:var(--surface); border:1px solid var(--line); padding:32px 28px;
  }
  .price-card::before{content:""; position:absolute; top:0; left:0; right:0; height:2px; background:var(--steel); opacity:0.6;}
  .price-card .ptype{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;}
  .price-card h3{font-family:'Playfair Display', serif; font-size:22px; margin:0 0 10px;}
  .price-card .amount{font-family:'JetBrains Mono', monospace; font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--text);}
  .price-card .amount .cur{font-size:14px; color:var(--muted); font-weight:400; margin-left:4px;}
  .price-card .from{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .price-note{grid-column:1/-1; font-size:12.5px; color:var(--muted); text-align:center; margin-top:6px;}

  /* ---------- location ---------- */
  .loc-card{
    background:var(--surface); border:1px solid var(--line); padding:34px 30px;
    display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:start;
  }
  @media (max-width:600px){ .loc-card{grid-template-columns:1fr;} }
  .loc-icon{width:52px; height:52px; border:1px solid var(--steel); border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
  .loc-icon svg{width:24px; height:24px; color:var(--steel);}
  .loc-card h3{font-family:'Playfair Display', serif; font-size:19px; margin:0 0 8px;}
  .loc-card p{margin:0; color:var(--muted); font-size:14.5px;}
  .loc-rows{display:grid; gap:16px; margin-top:22px;}
  .loc-row{display:flex; gap:12px; align-items:flex-start; padding-top:16px; border-top:1px solid var(--line);}
  .loc-row svg{width:17px; height:17px; color:var(--steel); flex:none; margin-top:2px;}
  .loc-row .label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:3px;}
  .loc-row .val{font-size:14.5px;}
  .loc-row a.val{font-family:'JetBrains Mono', monospace; text-decoration:none;}
  .loc-row a.val:hover{text-decoration:underline;}

  /* ---------- contact band ---------- */
  .contact-band{border-top:1px solid var(--line); background:linear-gradient(180deg, transparent, rgba(255,255,255,0.02));}
  .contact-inner{display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; padding-block:46px;}
  .contact-inner h2{font-family:'Playfair Display', serif; font-size:clamp(20px,2.4vw,25px); margin:0 0 6px; text-wrap:balance;}
  .contact-inner p{color:var(--muted); margin:0; font-size:14px;}
  .social-row{display:flex; gap:10px; flex-wrap:wrap;}

  footer{border-top:1px solid var(--line); padding-block:26px;}
  .foot-inner{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted);}
  .foot-inner img{height:16px;}
</style>
</head>
